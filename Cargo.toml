[package]
name = "spoor"
version = "0.1.0"
edition = "2021"
# zbus 5 needs 1.87; str::utf8_chunks alone would need 1.79.
rust-version = "1.87"
description = "Instant file-name search for Linux: a root fanotify daemon with CLI, GTK and KRunner front ends"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["search", "fanotify", "locate", "everything", "files"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
libc = "0.2"
zbus = "5"
gtk = "0.18"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# A panic while a thread holds the index lock would poison it: the daemon would
# stay "active" while every query failed, and systemd would never restart it.
# Abort instead, and let Restart=on-failure bring it back.
panic = "abort"
